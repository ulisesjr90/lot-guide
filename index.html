.bottom{margin-top:26px}
.totop{display:block;text-align:center;margin:20px auto 0;padding:12px;color:#002C5F;font-weight:700;text-decoration:none}
footer{text-align:center;color:#4a5263;font-size:13px;padding:8px 0 24px}

.model{display:none}.model.on{display:block}
.card.nn{border-left:6px solid #b3261e}
.card.ev{border-left:6px solid #00796b}

.at{flex:1 1 auto;min-width:0;font-size:17px;font-weight:800;line-height:1.25}

.abody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}

.ain{overflow:hidden;min-height:0}
.apad{padding:10px 14px 14px;border-top:1px solid #eef1f5}
.apad>.kv:first-child,.apad>h3:first-child{margin-top:0}

.pg:not(.vis){display:none!important}

.pmore.on,.pless.on{display:block}
.pless{display:none;margin:8px auto 0;min-height:44px;padding:0 14px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.accbar{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.xall{min-height:44px;padding:0 4px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}

.ans{color:#1a1f29;margin-top:4px}
.h2s{font-size:18px}

header{padding:8px 14px 6px!important}

.ddl{font-size:13px;font-weight:700;color:#4a5263;text-transform:uppercase;letter-spacing:.04em}

.qnav{display:flex;gap:8px;margin:6px 0 10px}
.qb{flex:1;min-height:50px;border:1px solid #c5cdd9;border-radius:12px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}

.fitcard h3 small{font-size:16px;font-weight:700;color:#1a1f29}

#lock{max-width:420px;margin:0 auto;padding:28px 18px}
#lock label{display:block;font-weight:700;color:#002C5F;margin:0 0 8px;font-size:17px}

#err{min-height:24px;margin-top:10px;color:#b3261e;font-weight:700;font-size:16px}
#lock p.note{margin:14px 0 0}
#lockLink{color:#4a5263}
</style>
