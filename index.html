<style>
:root{color-scheme:light only;--navy:#002C5F;--ink:#1a1f29;--ink2:#4a5263;--line:#d9dee7;--bg:#f4f6f9;--card:#ffffff;--gas:#1565c0;--gasbg:#e8f1fc;--hyb:#1b7f3b;--hybbg:#e7f5ec;--gold:#f6e7b8;--goldbg:#fff8e1;--goldink:#5c4300;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f6f9;color:#1a1f29;color-scheme:light only}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
header{background:#002C5F;color:#ffffff;padding:16px 16px 12px}
header h1{margin:0;font-size:22px;line-height:1.2;color:#ffffff}
header p{margin:4px 0 0;font-size:15px;color:#d6e2f2}
nav{position:sticky;top:0;z-index:10;background:#ffffff;border-bottom:1px solid #d9dee7;padding:8px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
nav button{flex:1 1 auto;min-height:40px;padding:8px 10px;border:1px solid #c5cdd9;border-radius:999px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:14px;font-weight:700;line-height:1.1;cursor:pointer}
nav button.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
h2{color:#002C5F;font-size:21px;margin:18px 4px 8px}
h3{color:#002C5F;font-size:18px;margin:0 0 8px}
.note{color:#4a5263;font-size:15px;margin:0 4px 10px}
.card{background:#ffffff;border:1px solid #d9dee7;border-radius:14px;padding:14px;margin:0 0 12px;color:#1a1f29}
.card.gas{border-left:6px solid #1565c0}
.card.hyb{border-left:6px solid #1b7f3b}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.top h3{margin:0;flex:1 1 auto}
.chip{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e8f1fc;color:#0d47a1}
.hyb .chip{background:#e7f5ec;color:#145c2c}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;margin:0 0 10px;font-size:16px}
.kv dt{color:#4a5263;font-weight:600}
.kv dd{margin:0;color:#1a1f29}
ul{margin:0;padding:0;list-style:none}
ul.check li,ul.dot li,ul.x li{position:relative;padding:3px 0 3px 26px;color:#1a1f29}
ul.check li:before{content:"\2713";position:absolute;left:2px;top:3px;font-weight:800;color:#1565c0}
.hyb ul.check li:before{color:#1b7f3b}
ul.dot li:before{content:"";position:absolute;left:8px;top:13px;width:7px;height:7px;border-radius:50%;background:#002C5F}
ul.x li:before{content:"\2715";position:absolute;left:3px;top:3px;font-weight:800;color:#b3261e}
.say{background:#fff8e1;border:1px solid #f0d98a;border-left:6px solid #d4a72c;border-radius:10px;padding:10px 12px;margin:10px 0 0;color:#3d2e00;font-weight:600}
.say b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#7a5a00;margin-bottom:2px}
.toggle{display:flex;gap:6px;margin:4px 0 12px}
.toggle button{flex:1;min-height:44px;border:1px solid #c5cdd9;background:#ffffff;color:#002C5F;font-family:inherit;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer}
.toggle button.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
.full{display:none;margin-top:12px;border-top:1px dashed #c5cdd9;padding-top:10px}
body.showfull .full{display:block}
.full .lbl{font-weight:700;color:#002C5F;margin:10px 0 2px;font-size:15px}
.full p{margin:0 0 4px;color:#1a1f29}
.heads{background:#fdecea;border:1px solid #f3b8b3;border-radius:10px;padding:8px 10px;margin-top:8px;color:#5f1410}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.grid .card{margin:0}
details{background:#ffffff;border:1px solid #d9dee7;border-radius:14px;margin:0 0 10px;color:#1a1f29}
summary{list-style:none;cursor:pointer;padding:14px 40px 14px 14px;font-weight:700;color:#002C5F;position:relative;min-height:48px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:14px;top:10px;font-size:24px;color:#002C5F}
details[open] summary:after{content:"\2212"}
summary small{display:block;font-weight:500;color:#4a5263;font-size:14px}
details .body{padding:0 14px 14px}
table{width:100%;border-collapse:collapse;font-size:15px;background:#ffffff;color:#1a1f29}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e3e7ee;vertical-align:top}
th{color:#002C5F;font-size:14px}
th.g,td.g{color:#0d47a1}th.h,td.h{color:#145c2c}
.fine{background:#eef3fa;border:1px solid #c9d8ec;border-radius:10px;padding:10px 12px;font-size:15px;color:#1f3a5c;margin-top:10px}
.view{display:none}.view.on{display:block}
a{color:#0b57d0}
.src li{padding:6px 0;border-bottom:1px solid #e3e7ee}
.src a{display:block;min-height:32px;text-decoration:none;font-weight:600}
.src span{display:block;font-size:13px;color:#4a5263;font-weight:400}
.bottom{margin-top:26px}
.totop{display:block;text-align:center;margin:20px auto 0;padding:12px;color:#002C5F;font-weight:700;text-decoration:none}
footer{text-align:center;color:#4a5263;font-size:13px;padding:8px 0 24px}

.model{display:none}.model.on{display:block}
.card.nn{border-left:6px solid #b3261e}
.card.ev{border-left:6px solid #00796b}
.ev .chip{background:#e0f2f1;color:#00564d}
.ev ul.check li:before{color:#00796b}
.nn .chip{background:#fdecea;color:#8c1d18}
.nn ul.check li:before{color:#b3261e}
.card h3 small,summary small{display:block;font-weight:500;color:#4a5263;font-size:14px}
/* cascades */
.acc{padding:0;overflow:hidden}
.ahd{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:12px 12px 12px 14px;border:0;background:transparent;font-family:inherit;text-align:left;cursor:pointer;color:#002C5F;-webkit-tap-highlight-color:rgba(0,44,95,.08)}
.at{flex:1 1 auto;min-width:0;font-size:17px;font-weight:800;line-height:1.25}
.at small{display:block;font-size:12px;font-weight:700;color:#4a5263;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.at .asub{display:block;font-style:normal;font-weight:500;color:#4a5263;font-size:14px;margin-top:2px}
.am{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 1 auto;max-width:46%}
.am .chip{font-size:13px;text-align:right;line-height:1.25;border-radius:10px}
.astk{font-size:12px;font-weight:700;color:#4a5263;white-space:nowrap}
.chev{flex:0 0 30px;height:30px;border-radius:50%;background:#eef2f7;position:relative;transition:transform .26s ease}
.chev:before{content:"";position:absolute;left:10px;top:8px;width:8px;height:8px;border-right:2.5px solid #002C5F;border-bottom:2.5px solid #002C5F;transform:rotate(45deg)}
.acc.open .chev{transform:rotate(180deg)}
.abody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.acc.open .abody{grid-template-rows:1fr}
.ain{overflow:hidden;min-height:0}
.apad{padding:10px 14px 14px;border-top:1px solid #eef1f5}
.apad>.kv:first-child,.apad>h3:first-child{margin-top:0}
body.noanim .abody,body.noanim .chev{transition:none}
.pg:not(.vis){display:none!important}
li.sl{list-style:none;padding-left:0!important;font-weight:700;color:#4a5263;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 2px}
li.sl:before{content:none!important;display:none!important}
li.sl:not(.vis){display:none!important}
.pu .lbl{font-weight:700;color:#002C5F;margin:10px 0 2px;font-size:15px}
.pu p{margin:0 0 4px;color:#1a1f29}
.pu.first{border-top:1px dashed #c5cdd9;margin-top:12px;padding-top:4px}
.pmore{display:none;width:100%;min-height:48px;margin-top:12px;border:1px solid #c5cdd9;border-radius:10px;background:#f4f6f9;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.pmore.on,.pless.on{display:block}
.pless{display:none;margin:8px auto 0;min-height:44px;padding:0 14px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.accbar{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.xall{min-height:44px;padding:0 4px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.acc .apad .say:first-child{margin-top:0}
.morehint{font-size:13px;color:#4a5263;margin:6px 0 0}
body.showfull .morehint{display:none}
.full .sublbl{font-weight:700;color:#4a5263;font-size:14px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.para{margin:6px 0 0;color:#1a1f29}
.card ul + .para,.card ul + ul{margin-top:8px}
.ans{color:#1a1f29;margin-top:4px}
.h2s{font-size:18px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{min-width:100%}
.tbl.wide table{font-size:13px}.tbl.wide th,.tbl.wide td{padding:6px 3px}.tbl.wide th{font-size:12px}
.src2 li{padding:6px 0;border-bottom:1px solid #e3e7ee;font-size:15px;word-break:break-word;color:#1a1f29}
.say i{font-style:italic}
header{padding:8px 14px 6px!important}
header h1{font-size:18px!important;margin:0!important;line-height:1.3}
header p{display:none}
#bar{position:sticky;top:0;z-index:30;background:#002C5F;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.brow{display:flex;gap:6px}
.brow+.brow{margin-top:6px}
.dd{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid #5d7ea8;border-radius:12px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:17px;font-weight:800;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ddl{font-size:13px;font-weight:700;color:#4a5263;text-transform:uppercase;letter-spacing:.04em}
.ddl:after{content:":"}
.ddv{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddc{flex:0 0 12px;height:12px;position:relative;transition:transform .2s}
.ddc:before{content:"";position:absolute;left:2px;top:0;width:7px;height:7px;border-right:2.5px solid #002C5F;border-bottom:2.5px solid #002C5F;transform:rotate(45deg)}
.dd[aria-expanded="true"] .ddc{transform:rotate(180deg) translateY(-3px)}
.dd[aria-expanded="true"]{box-shadow:0 0 0 3px #9cc0f0}
#fitBtn{flex:0 0 auto;height:44px;padding:0 12px;border:0;border-radius:12px;background:#f6e7b8;color:#3d2e00;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
#fitBtn .fi{display:inline-block;margin-right:5px;color:#1b7f3b;font-weight:900}
#fitBtn.on{background:#ffffff;color:#002C5F;box-shadow:0 0 0 3px #f6e7b8 inset}
.ddp{display:none;position:absolute!important;left:8px;right:8px;top:calc(100% + 6px);max-height:calc(100vh - 150px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff!important;border:1px solid #d9dee7!important;border-radius:14px;box-shadow:0 10px 30px rgba(0,20,50,.28)!important;padding:6px!important;z-index:31}
.ddp.on{display:block!important}
.ddp button{display:flex!important;align-items:center;gap:10px;width:100%;min-height:50px!important;padding:10px 14px!important;margin:0!important;border:0!important;border-radius:10px!important;background:#ffffff!important;color:#002C5F!important;font-family:inherit;font-size:17px!important;font-weight:700;text-align:left;cursor:pointer;flex:none!important}
.ddp button+button{border-top:1px solid #eef1f5!important;border-radius:0!important}
.ddp button span{flex:1 1 auto}
.ddp button small{font-size:15px;font-weight:600;color:#4a5263}
.ddp button.on{background:#e8f1fc!important}
.ddp button.on:after{content:"✓";font-weight:900;color:#1565c0;margin-left:6px}
#ddx{display:none;position:fixed;inset:0;z-index:25;background:rgba(0,20,50,.25)}
#ddx.on{display:block}
.quiz{display:none}.quiz.on{display:block}
.prog{height:8px;background:#e3e7ee;border-radius:99px;overflow:hidden;margin:6px 4px 10px}
.prog div{height:100%;background:#1b7f3b;border-radius:99px}
.qstep{color:#4a5263;font-size:14px;font-weight:700;margin:0 4px}
.qh{margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border:1px solid #c5cdd9;border-radius:14px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:18px;font-weight:700;text-align:left;cursor:pointer}
.opt.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
.opt .box{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 26px;border:2px solid #9aa6b8;border-radius:7px;background:#ffffff;color:#002C5F;font-size:17px}
.opt.on .box{border-color:#ffffff}
.qnav{display:flex;gap:8px;margin:6px 0 10px}
.qb{flex:1;min-height:50px;border:1px solid #c5cdd9;border-radius:12px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.qb:disabled{opacity:.4}
.qb.next{background:#002C5F;color:#ffffff;border-color:#002C5F}
.shownow{width:100%;min-height:50px;border:2px solid #d4a72c;border-radius:12px;background:#fff8e1;color:#5c4300;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.fitcard h3 small{font-size:16px;font-weight:700;color:#1a1f29}
.fitcard ul.x{margin-top:6px}
.golink{display:block;width:100%;min-height:46px;margin-top:10px;border:1px solid #c5cdd9;border-radius:10px;background:#f4f6f9;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.card.flash{box-shadow:0 0 0 4px #f0d98a;transition:box-shadow .3s}

#lock{max-width:420px;margin:0 auto;padding:28px 18px}
#lock label{display:block;font-weight:700;color:#002C5F;margin:0 0 8px;font-size:17px}
#pw{width:100%;font-size:18px;padding:14px;border:1px solid #9aa6b8;border-radius:12px;background:#ffffff;color:#1a1f29;font-family:inherit}
#pw:focus{outline:3px solid #9cc0f0;border-color:#002C5F}
#unlock{width:100%;min-height:54px;margin-top:12px;border:0;border-radius:12px;background:#002C5F;color:#ffffff;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer}
#unlock:disabled{opacity:.6}
#err{min-height:24px;margin-top:10px;color:#b3261e;font-weight:700;font-size:16px}
#lock p.note{margin:14px 0 0}
#lockLink{color:#4a5263}
</style>
</head>

</div>
