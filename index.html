table{width:100%;border-collapse:collapse;font-size:15px;background:#ffffff;color:#1a1f29}

a{color:#0b57d0}

.src span{display:block;font-size:13px;color:#4a5263;font-weight:400}
.bottom{margin-top:26px}
.totop{display:block;text-align:center;margin:20px auto 0;padding:12px;color:#002C5F;font-weight:700;text-decoration:none}
footer{text-align:center;color:#4a5263;font-size:13px;padding:8px 0 24px}

.model{display:none}.model.on{display:block}
.card.nn{border-left:6px solid #b3261e}
.card.ev{border-left:6px solid #00796b}

.nn .chip{background:#fdecea;color:#8c1d18}

.at{flex:1 1 auto;min-width:0;font-size:17px;font-weight:800;line-height:1.25}
.at small{display:block;font-size:12px;font-weight:700;color:#4a5263;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}

.abody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}

.ain{overflow:hidden;min-height:0}
.apad{padding:10px 14px 14px;border-top:1px solid #eef1f5}
.apad>.kv:first-child,.apad>h3:first-child{margin-top:0}

.pg:not(.vis){display:none!important}
li.sl{list-style:none;padding-left:0!important;font-weight:700;color:#4a5263;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 2px}

.pmore{display:none;width:100%;min-height:48px;margin-top:12px;border:1px solid #c5cdd9;border-radius:10px;background:#f4f6f9;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.pmore.on,.pless.on{display:block}
.pless{display:none;margin:8px auto 0;min-height:44px;padding:0 14px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}
.accbar{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.xall{min-height:44px;padding:0 4px;background:none;border:0;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer}

.morehint{font-size:13px;color:#4a5263;margin:6px 0 0}

.para{margin:6px 0 0;color:#1a1f29}

.ans{color:#1a1f29;margin-top:4px}
.h2s{font-size:18px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}

.tbl.wide table{font-size:13px}.tbl.wide th,.tbl.wide td{padding:6px 3px}.tbl.wide th{font-size:12px}
.src2 li{padding:6px 0;border-bottom:1px solid #e3e7ee;font-size:15px;word-break:break-word;color:#1a1f29}

header{padding:8px 14px 6px!important}

.brow{display:flex;gap:6px}
.brow+.brow{margin-top:6px}
.dd{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid #5d7ea8;border-radius:12px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:17px;font-weight:800;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ddl{font-size:13px;font-weight:700;color:#4a5263;text-transform:uppercase;letter-spacing:.04em}
.ddl:after{content:":"}
.ddv{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ddc{flex:0 0 12px;height:12px;position:relative;transition:transform .2s}

.opt.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
.opt .box{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 26px;border:2px solid #9aa6b8;border-radius:7px;background:#ffffff;color:#002C5F;font-size:17px}

.qnav{display:flex;gap:8px;margin:6px 0 10px}
.qb{flex:1;min-height:50px;border:1px solid #c5cdd9;border-radius:12px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}

.shownow{width:100%;min-height:50px;border:2px solid #d4a72c;border-radius:12px;background:#fff8e1;color:#5c4300;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.fitcard h3 small{font-size:16px;font-weight:700;color:#1a1f29}
.fitcard ul.x{margin-top:6px}
.golink{display:block;width:100%;min-height:46px;margin-top:10px;border:1px solid #c5cdd9;border-radius:10px;background:#f4f6f9;color:#0b57d0;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.card.flash{box-shadow:0 0 0 4px #f0d98a;transition:box-shadow .3s}

#lock{max-width:420px;margin:0 auto;padding:28px 18px}
#lock label{display:block;font-weight:700;color:#002C5F;margin:0 0 8px;font-size:17px}
#pw{width:100%;font-size:18px;padding:14px;border:1px solid #9aa6b8;border-radius:12px;background:#ffffff;color:#1a1f29;font-family:inherit}

#unlock{width:100%;min-height:54px;margin-top:12px;border:0;border-radius:12px;background:#002C5F;color:#ffffff;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer}
#unlock:disabled{opacity:.6}
#err{min-height:24px;margin-top:10px;color:#b3261e;font-weight:700;font-size:16px}
#lock p.note{margin:14px 0 0}
#lockLink{color:#4a5263}
</style>
