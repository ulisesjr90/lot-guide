<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#002C5F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tucson Guide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Tucson Guide</title>
<style>
:root{color-scheme:light only;--navy:#002C5F;--ink:#1a1f29;--ink2:#4a5263;--line:#d9dee7;--bg:#f4f6f9;--card:#ffffff;--gas:#1565c0;--gasbg:#e8f1fc;--hyb:#1b7f3b;--hybbg:#e7f5ec;--gold:#f6e7b8;--goldbg:#fff8e1;--goldink:#5c4300;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f6f9;color:#1a1f29;color-scheme:light only}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
header{background:#002C5F;color:#ffffff;padding:16px 16px 12px}
header h1{margin:0;font-size:22px;line-height:1.2;color:#ffffff}
header p{margin:4px 0 0;font-size:15px;color:#d6e2f2}
nav{position:sticky;top:0;z-index:10;background:#ffffff;border-bottom:1px solid #d9dee7;padding:8px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
nav button{flex:1 1 auto;min-height:40px;padding:8px 10px;border:1px solid #c5cdd9;border-radius:999px;background:#ffffff;color:#002C5F;font-family:inherit;font-size:14px;font-weight:700;line-height:1.1;cursor:pointer}
nav button.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
h2{color:#002C5F;font-size:21px;margin:18px 4px 8px}
h3{color:#002C5F;font-size:18px;margin:0 0 8px}
.note{color:#4a5263;font-size:15px;margin:0 4px 10px}
.card{background:#ffffff;border:1px solid #d9dee7;border-radius:14px;padding:14px;margin:0 0 12px;color:#1a1f29}
.card.gas{border-left:6px solid #1565c0}
.card.hyb{border-left:6px solid #1b7f3b}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.top h3{margin:0;flex:1 1 auto}
.chip{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e8f1fc;color:#0d47a1}
.hyb .chip{background:#e7f5ec;color:#145c2c}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;margin:0 0 10px;font-size:16px}
.kv dt{color:#4a5263;font-weight:600}
.kv dd{margin:0;color:#1a1f29}
ul{margin:0;padding:0;list-style:none}
ul.check li,ul.dot li,ul.x li{position:relative;padding:3px 0 3px 26px;color:#1a1f29}
ul.check li:before{content:"\2713";position:absolute;left:2px;top:3px;font-weight:800;color:#1565c0}
.hyb ul.check li:before{color:#1b7f3b}
ul.dot li:before{content:"";position:absolute;left:8px;top:13px;width:7px;height:7px;border-radius:50%;background:#002C5F}
ul.x li:before{content:"\2715";position:absolute;left:3px;top:3px;font-weight:800;color:#b3261e}
.say{background:#fff8e1;border:1px solid #f0d98a;border-left:6px solid #d4a72c;border-radius:10px;padding:10px 12px;margin:10px 0 0;color:#3d2e00;font-weight:600}
.say b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#7a5a00;margin-bottom:2px}
.toggle{display:flex;gap:6px;margin:4px 0 12px}
.toggle button{flex:1;min-height:44px;border:1px solid #c5cdd9;background:#ffffff;color:#002C5F;font-family:inherit;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer}
.toggle button.on{background:#002C5F;color:#ffffff;border-color:#002C5F}
.full{display:none;margin-top:12px;border-top:1px dashed #c5cdd9;padding-top:10px}
body.showfull .full{display:block}
.full .lbl{font-weight:700;color:#002C5F;margin:10px 0 2px;font-size:15px}
.full p{margin:0 0 4px;color:#1a1f29}
.heads{background:#fdecea;border:1px solid #f3b8b3;border-radius:10px;padding:8px 10px;margin-top:8px;color:#5f1410}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.grid .card{margin:0}
details{background:#ffffff;border:1px solid #d9dee7;border-radius:14px;margin:0 0 10px;color:#1a1f29}
summary{list-style:none;cursor:pointer;padding:14px 40px 14px 14px;font-weight:700;color:#002C5F;position:relative;min-height:48px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:14px;top:10px;font-size:24px;color:#002C5F}
details[open] summary:after{content:"\2212"}
summary small{display:block;font-weight:500;color:#4a5263;font-size:14px}
details .body{padding:0 14px 14px}
table{width:100%;border-collapse:collapse;font-size:15px;background:#ffffff;color:#1a1f29}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e3e7ee;vertical-align:top}
th{color:#002C5F;font-size:14px}
th.g,td.g{color:#0d47a1}th.h,td.h{color:#145c2c}
.fine{background:#eef3fa;border:1px solid #c9d8ec;border-radius:10px;padding:10px 12px;font-size:15px;color:#1f3a5c;margin-top:10px}
.view{display:none}.view.on{display:block}
a{color:#0b57d0}
.src li{padding:6px 0;border-bottom:1px solid #e3e7ee}
.src a{display:block;min-height:32px;text-decoration:none;font-weight:600}
.src span{display:block;font-size:13px;color:#4a5263;font-weight:400}
.bottom{margin-top:26px}
.totop{display:block;text-align:center;margin:20px auto 0;padding:12px;color:#002C5F;font-weight:700;text-decoration:none}
footer{text-align:center;color:#4a5263;font-size:13px;padding:8px 0 24px}

#lock{max-width:420px;margin:0 auto;padding:28px 18px}
#lock label{display:block;font-weight:700;color:#002C5F;margin:0 0 8px;font-size:17px}
#pw{width:100%;font-size:18px;padding:14px;border:1px solid #9aa6b8;border-radius:12px;background:#ffffff;color:#1a1f29;font-family:inherit}
#pw:focus{outline:3px solid #9cc0f0;border-color:#002C5F}
#unlock{width:100%;min-height:54px;margin-top:12px;border:0;border-radius:12px;background:#002C5F;color:#ffffff;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer}
#unlock:disabled{opacity:.6}
#err{min-height:24px;margin-top:10px;color:#b3261e;font-weight:700;font-size:16px}
#lock p.note{margin:14px 0 0}
#lockLink{color:#4a5263}
</style>
</head>
<body>
<div id="app">
<header>
<h1>2026 Tucson Floor Guide</h1>
<p>Wyatt Johnson Hyundai</p>
</header>
<div id="lock">
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
<button id="unlock" type="button">Unlock</button>
<div id="err" role="alert"></div>
<p class="note">Stays unlocked on this phone after the first time.</p>
</div>
</div>
